name: Run NTO Scanner

on:
  schedule:
    # Runs every 15 minutes from 9:00 AM to 3:30 PM IST (Mon-Fri)
    # Cron uses UTC time: 3:30 AM to 10:00 AM UTC = 9:00 AM to 3:30 PM IST
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner script
        run: python scanner.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add nto_scan_results.csv
          git commit -m "Auto-update live NTO scan results [skip ci]" || exit 0
          git push origin main
